version: 2

before:
  hooks:
    - go mod download

builds:
  - id: pronestheus
    main: ./cmd/pronestheus/main.go
    binary: pronestheus
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: archive
    format_overrides:
      - goos: windows
        format: zip
    # Don't include any additional files into the archives (such as README, CHANGELOG etc).
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

changelog:
  disable: true

release:
  github:
    owner: grdl
    name: pronestheus

dockers:
  - dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    image_templates:
      - "grdl/pronestheus:{{ .Tag }}"
      - "grdl/pronestheus:latest"
  - dockerfile: Dockerfile
    goos: linux
    goarch: arm64
    image_templates:
      - "grdl/pronestheus:{{ .Tag }}"
      - "grdl/pronestheus:latest"

nfpms:
  - license: MIT
    maintainer: grdl
    homepage: https://github.com/grdl/pronestheus
    bindir: /usr/local/bin
    description: Prometheus exporter for the Nest Learning Thermostat
    formats:
      - deb
      - rpm
